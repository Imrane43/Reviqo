<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>REVIQO · Tableau de bord</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/css/app.css" />
<script>document.documentElement.classList.add('js');</script>
</head>
<body>
<a class="skip-link" href="#view">Aller au contenu principal</a>
<div class="mobile-top">
  <a class="brand" href="#home"><span class="brand-mark">R</span> REVIQO</a>
  <div class="row" style="gap:8px">
    <button class="icon-btn" id="themeBtn" aria-label="Thème">🌙</button>
    <button class="icon-btn" id="notifBtn" aria-label="Notifications" style="position:relative">🔔<span id="notifDot" class="hidden" style="position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--red)"></span></button>
  </div>
</div>

<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#home"><span class="brand-mark">R</span> REVIQO</a>
    <nav id="sideNav"></nav>
    <div class="sidebar-foot">
      <div class="mini-user" id="miniUser"></div>
      <button class="btn btn-outline btn-sm" id="themeBtn2">🌗 Thème</button>
    </div>
  </aside>

  <main class="main" id="main-content" tabindex="-1">
    <div class="topbar">
      <div>
        <div class="faint" id="pageEyebrow" style="font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase"></div>
        <h1 id="pageTitle">Tableau de bord</h1>
      </div>
      <div class="row" style="gap:10px">
        <a class="btn btn-primary btn-sm" href="#study">✨ Étudier</a>
        <div class="avatar sm" id="topAvatar">R</div>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<div id="modalHost"></div>
<div class="toast-host"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
